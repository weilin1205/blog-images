<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="範例有向圖：5 個節點、6 條帶權重的有向邊，起點為節點 0">
  <title>範例有向圖：5 個節點、6 條帶權重的有向邊，起點為節點 0</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8178"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="24" fill="#fffaf3"/>
  <g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#3b332d">
    <text x="60" y="68" font-size="26" font-weight="700">範例有向加權圖</text>
    <!-- legend -->
    <circle cx="656" cy="60" r="11" fill="#d9734e"/>
    <text x="676" y="67" font-size="18">起點</text>
    <rect x="740" y="45" width="36" height="30" rx="15" fill="#fff4d6" stroke="#e2b84f" stroke-width="2"/>
    <text x="758" y="66" font-size="18" font-weight="700" text-anchor="middle">w</text>
    <text x="786" y="67" font-size="18">邊的權重</text>
  </g>
  <!-- edges -->
  <g stroke="#8c8178" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="171.9" y1="283.4" x2="343.9" y2="194.0"/>
    <line x1="171.9" y1="316.6" x2="343.9" y2="406.0"/>
    <line x1="390" y1="394" x2="390" y2="222"/>
    <line x1="421.9" y1="186.6" x2="593.9" y2="276.0"/>
    <line x1="421.9" y1="413.4" x2="593.9" y2="324.0"/>
    <line x1="676" y1="300" x2="798" y2="300"/>
  </g>
  <!-- weight labels -->
  <g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#3b332d" text-anchor="middle">
    <rect x="245" y="219" width="40" height="32" rx="16" fill="#fff4d6" stroke="#e2b84f" stroke-width="2"/>
    <text x="265" y="242">4</text>
    <rect x="245" y="349" width="40" height="32" rx="16" fill="#fff4d6" stroke="#e2b84f" stroke-width="2"/>
    <text x="265" y="372">1</text>
    <rect x="370" y="292" width="40" height="32" rx="16" fill="#fff4d6" stroke="#e2b84f" stroke-width="2"/>
    <text x="390" y="315">2</text>
    <rect x="495" y="219" width="40" height="32" rx="16" fill="#fff4d6" stroke="#e2b84f" stroke-width="2"/>
    <text x="515" y="242">1</text>
    <rect x="495" y="349" width="40" height="32" rx="16" fill="#fff4d6" stroke="#e2b84f" stroke-width="2"/>
    <text x="515" y="372">5</text>
    <rect x="717" y="284" width="40" height="32" rx="16" fill="#fff4d6" stroke="#e2b84f" stroke-width="2"/>
    <text x="737" y="307">3</text>
  </g>
  <!-- nodes -->
  <g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    <circle cx="140" cy="300" r="36" fill="#d9734e" stroke="#b85a38" stroke-width="3"/>
    <text x="140" y="309" fill="#ffffff">0</text>
    <circle cx="390" cy="170" r="36" fill="#eaf1f7" stroke="#6f93b8" stroke-width="3"/>
    <text x="390" y="179" fill="#3b332d">1</text>
    <circle cx="390" cy="430" r="36" fill="#eaf1f7" stroke="#6f93b8" stroke-width="3"/>
    <text x="390" y="439" fill="#3b332d">2</text>
    <circle cx="640" cy="300" r="36" fill="#eaf1f7" stroke="#6f93b8" stroke-width="3"/>
    <text x="640" y="309" fill="#3b332d">3</text>
    <circle cx="850" cy="300" r="36" fill="#eaf1f7" stroke="#6f93b8" stroke-width="3"/>
    <text x="850" y="309" fill="#3b332d">4</text>
  </g>
  <!-- start tag -->
  <g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
    <rect x="104" y="214" width="72" height="30" rx="15" fill="#fbe3d8" stroke="#d9734e" stroke-width="2"/>
    <text x="140" y="235" font-size="18" font-weight="700" fill="#b85a38" text-anchor="middle">start</text>
  </g>
</svg>